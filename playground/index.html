<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eshkol Playground</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.css">
<style>
  :root {
    --bg: #1e1e2e;
    --bg-surface: #181825;
    --bg-editor: #11111b;
    --text: #cdd6f4;
    --text-dim: #6c7086;
    --accent: #89b4fa;
    --accent-hover: #b4d0fb;
    --green: #a6e3a1;
    --red: #f38ba8;
    --orange: #fab387;
    --yellow: #f9e2af;
    --mauve: #cba6f7;
    --teal: #94e2d5;
    --border: #313244;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  header h1 span {
    color: var(--accent);
  }

  .header-meta {
    font-size: 12px;
    color: var(--text-dim);
  }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    flex: 1;
    min-height: 0;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .panel:first-child {
    border-right: 1px solid var(--border);
  }

  .editor-wrap {
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* CodeMirror dark theme overrides */
  .CodeMirror {
    height: 100%;
    background: var(--bg-editor);
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.6;
  }

  .CodeMirror-gutters {
    background: var(--bg-editor);
    border-right: 1px solid var(--border);
  }

  .CodeMirror-linenumber {
    color: var(--text-dim);
  }

  .CodeMirror-cursor {
    border-left-color: var(--text);
  }

  .CodeMirror-selected {
    background: #313244 !important;
  }

  .CodeMirror-focused .CodeMirror-selected {
    background: #45475a !important;
  }

  .CodeMirror-activeline-background {
    background: #181825;
  }

  .CodeMirror-matchingbracket {
    color: var(--green) !important;
    font-weight: bold;
    text-decoration: underline;
  }

  .CodeMirror-nonmatchingbracket {
    color: var(--red) !important;
  }

  /* Scheme syntax colors */
  .cm-s-eshkol .cm-keyword { color: var(--mauve); }
  .cm-s-eshkol .cm-builtin { color: var(--accent); }
  .cm-s-eshkol .cm-atom { color: var(--orange); }
  .cm-s-eshkol .cm-number { color: var(--orange); }
  .cm-s-eshkol .cm-string { color: var(--green); }
  .cm-s-eshkol .cm-string-2 { color: var(--green); }
  .cm-s-eshkol .cm-variable { color: var(--text); }
  .cm-s-eshkol .cm-variable-2 { color: var(--teal); }
  .cm-s-eshkol .cm-def { color: var(--accent); }
  .cm-s-eshkol .cm-comment { color: var(--text-dim); font-style: italic; }
  .cm-s-eshkol .cm-bracket { color: var(--text-dim); }
  .cm-s-eshkol .cm-tag { color: var(--red); }
  .cm-s-eshkol .cm-link { color: var(--accent); }
  .cm-s-eshkol .cm-error { color: var(--red); }
  .cm-s-eshkol .cm-meta { color: var(--yellow); }
  .cm-s-eshkol .cm-qualifier { color: var(--teal); }
  .cm-s-eshkol .cm-property { color: var(--teal); }

  .actions {
    display: flex;
    gap: 8px;
  }

  button {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  button:hover {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button:disabled:hover {
    background: transparent;
    color: var(--accent);
    border-color: var(--border);
  }

  button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .output-wrap {
    flex: 1;
    overflow: auto;
    background: var(--bg-editor);
    min-height: 0;
  }

  #output {
    padding: 16px;
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 100%;
  }

  #output.error {
    color: var(--red);
  }

  /* JSON syntax coloring */
  .json-key { color: var(--accent); }
  .json-string { color: var(--green); }
  .json-number { color: var(--orange); }
  .json-bool { color: var(--mauve); }
  .json-null { color: var(--text-dim); }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  #status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--yellow);
  }

  #status-dot.ready { background: var(--green); }
  #status-dot.error { background: var(--red); }

  kbd {
    background: var(--border);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    font-family: inherit;
  }

  /* Mode tabs */
  .mode-tabs { display: flex; gap: 4px; }
  .mode-tab {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid transparent;
    padding: 4px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-tab:hover { color: var(--text); }
  .mode-tab.active {
    color: var(--accent);
    border-color: var(--border);
    background: var(--bg-editor);
  }

  /* Mode visibility */
  body.mode-repl .panels { display: none; }
  body.mode-editor .repl-container { display: none; }

  /* REPL styles */
  .repl-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .repl-output {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    background: var(--bg-editor);
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.6;
    min-height: 0;
  }
  .repl-entry { margin-bottom: 4px; }
  .repl-echo { color: var(--text-dim); }
  .repl-prompt-text { color: var(--accent); font-weight: 600; }
  .repl-result { color: var(--teal); white-space: pre-wrap; }
  .repl-result.error { color: var(--red); }
  .repl-result.output { color: var(--text-dim); font-style: italic; }
  .repl-result.cmd { color: var(--text-dim); }
  .repl-welcome { color: var(--text-dim); margin-bottom: 8px; }
  .repl-welcome b { color: var(--accent); font-weight: 600; }
  .repl-input-row {
    display: flex;
    align-items: center;
    padding: 6px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
    flex-shrink: 0;
  }
  .repl-prompt {
    color: var(--accent);
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 14px;
    font-weight: 600;
    white-space: pre;
    flex-shrink: 0;
  }
  #repl-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 14px;
    line-height: 1.6;
    caret-color: var(--text);
  }

  @media (max-width: 768px) {
    .panels {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .panel:first-child {
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
  }
</style>
</head>
<body class="mode-editor">

<header>
  <h1><span>Eshkol</span> Playground</h1>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-editor" onclick="switchMode('editor')">Editor</button>
    <button class="mode-tab" id="tab-repl" onclick="switchMode('repl')">REPL</button>
  </div>
  <div class="header-meta">compiler frontend in WebAssembly</div>
</header>

<div class="panels">
  <div class="panel">
    <div class="panel-header">
      <span>Editor</span>
      <span><kbd>Ctrl+Enter</kbd> Run &nbsp; <kbd>Ctrl+Shift+Enter</kbd> Pretty Print</span>
    </div>
    <div class="editor-wrap">
      <textarea id="editor">;; Eshkol Playground
;; Click "Parse" to see the AST, or "Pretty Print" for formatted output.

(define pi 3.14159265)

(define (square x) (* x x))

(define (cube x) (* x (* x x)))

(define (compose f g)
  (lambda (x) (f (g x))))

(let ((radius 5.0)
      (area (lambda (r) (* pi (square r)))))
  (area radius))
</textarea>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>Output</span>
      <div class="actions">
        <button id="btn-run" disabled>Run</button>
        <button id="btn-parse" disabled>Parse</button>
        <button id="btn-pretty" disabled>Pretty Print</button>
        <button id="btn-clear" disabled>Clear</button>
      </div>
    </div>
    <div class="output-wrap">
      <div id="output"></div>
    </div>
  </div>
</div>

<div class="repl-container" style="display:none">
  <div class="repl-output" id="repl-output">
    <div class="repl-welcome"><b>Eshkol REPL</b> (tree-walking interpreter in WebAssembly)<br>Type expressions to evaluate. Try <span style="color:var(--green)">(+ 1 2)</span> or <span style="color:var(--green)">:help</span></div>
  </div>
  <div class="repl-input-row">
    <span class="repl-prompt" id="repl-prompt-label">eshkol&gt; </span>
    <input type="text" id="repl-input" autocomplete="off" spellcheck="false" disabled>
  </div>
</div>

<footer>
  <div><span id="status-dot"></span><span id="status">Loading compiler...</span></div>
  <div id="timing"></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/scheme/scheme.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/selection/active-line.min.js"></script>
<script src="wasm/eshkol-wasm.js"></script>
<script>
  // --- CodeMirror setup ---

  var cm = CodeMirror.fromTextArea(document.getElementById('editor'), {
    mode: 'scheme',
    theme: 'eshkol',
    lineNumbers: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    styleActiveLine: true,
    indentUnit: 2,
    tabSize: 2,
    indentWithTabs: false,
    extraKeys: {
      'Ctrl-Enter': function() { if (mod) runEval(); },
      'Cmd-Enter': function() { if (mod) runEval(); },
      'Ctrl-Shift-Enter': function() { if (mod) runPrettyPrint(); },
      'Cmd-Shift-Enter': function() { if (mod) runPrettyPrint(); },
      'Tab': function(cm) {
        if (cm.somethingSelected()) {
          cm.indentSelection('add');
        } else {
          cm.replaceSelection('  ', 'end');
        }
      }
    }
  });

  var output = document.getElementById('output');
  var status = document.getElementById('status');
  var statusDot = document.getElementById('status-dot');
  var timing = document.getElementById('timing');
  var btnRun = document.getElementById('btn-run');
  var btnParse = document.getElementById('btn-parse');
  var btnPretty = document.getElementById('btn-pretty');
  var btnClear = document.getElementById('btn-clear');

  var mod = null;

  // --- JSON syntax highlighting ---

  function highlightJSON(json) {
    var str = JSON.stringify(json, null, 2);
    return str.replace(
      /("(?:\\.|[^"\\])*")\s*:/g,
      '<span class="json-key">$1</span>:'
    ).replace(
      /:\s*("(?:\\.|[^"\\])*")/g,
      function(match, val) { return ': <span class="json-string">' + val + '</span>'; }
    ).replace(
      /:\s*(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
      ': <span class="json-number">$1</span>'
    ).replace(
      /:\s*(true|false)/g,
      ': <span class="json-bool">$1</span>'
    ).replace(
      /:\s*(null)/g,
      ': <span class="json-null">$1</span>'
    );
  }

  // --- Actions ---

  var editorCtx = null; // interpreter context for editor Run

  function runEval() {
    var source = cm.getValue();
    output.className = '';
    try {
      // Create a fresh context each run
      if (editorCtx) mod.ccall('eshkol_wasm_interp_destroy', null, ['number'], [editorCtx]);
      editorCtx = mod.ccall('eshkol_wasm_interp_create', 'number', [], []);

      var t0 = performance.now();
      var ptr = mod.ccall('eshkol_wasm_eval', 'number', ['number', 'string'], [editorCtx, source]);
      var raw = mod.UTF8ToString(ptr);
      mod.ccall('eshkol_wasm_free', null, ['number'], [ptr]);
      var elapsed = (performance.now() - t0).toFixed(1);

      var result;
      try { result = JSON.parse(raw); } catch(e) { result = { error: raw }; }

      var text = '';
      if (result.output) text += result.output;
      if (result.error) {
        text += (text ? '\n' : '') + 'Error: ' + result.error;
        output.className = 'error';
      } else if (result.value && result.type !== 'void') {
        text += (text ? '\n' : '') + result.value;
      }

      output.textContent = text || '(no output)';
      timing.textContent = 'Evaluated in ' + elapsed + 'ms';
      btnRun.classList.add('active');
      btnParse.classList.remove('active');
      btnPretty.classList.remove('active');
    } catch (e) {
      output.className = 'error';
      output.textContent = 'Error: ' + e.message;
      timing.textContent = '';
    }
  }

  function callWasm(name, source) {
    var ptr = mod.ccall(name, 'number', ['string'], [source]);
    var str = mod.UTF8ToString(ptr);
    mod.ccall('eshkol_wasm_free', null, ['number'], [ptr]);
    return str;
  }

  function runParse() {
    var source = cm.getValue();
    output.className = '';
    try {
      var t0 = performance.now();
      var json = callWasm('eshkol_wasm_parse', source);
      var result = JSON.parse(json);
      var elapsed = (performance.now() - t0).toFixed(1);

      if (result.error) {
        output.className = 'error';
        output.textContent = 'Error: ' + result.error;
        timing.textContent = '';
      } else {
        output.innerHTML = highlightJSON(result);
        timing.textContent = 'Parsed in ' + elapsed + 'ms \u2014 ' + result.count + ' expression' + (result.count !== 1 ? 's' : '');
      }
      btnParse.classList.add('active');
      btnPretty.classList.remove('active');
    } catch (e) {
      output.className = 'error';
      output.textContent = 'Error: ' + e.message;
      timing.textContent = '';
    }
  }

  function runPrettyPrint() {
    var source = cm.getValue();
    output.className = '';
    try {
      var t0 = performance.now();
      var result = callWasm('eshkol_wasm_pretty_print', source);
      var elapsed = (performance.now() - t0).toFixed(1);

      output.textContent = result;
      timing.textContent = 'Pretty-printed in ' + elapsed + 'ms';
      btnPretty.classList.add('active');
      btnParse.classList.remove('active');
    } catch (e) {
      output.className = 'error';
      output.textContent = 'Error: ' + e.message;
      timing.textContent = '';
    }
  }

  btnRun.addEventListener('click', runEval);
  btnParse.addEventListener('click', runParse);
  btnPretty.addEventListener('click', runPrettyPrint);
  btnClear.addEventListener('click', function() {
    output.textContent = '';
    output.className = '';
    output.innerHTML = '';
    timing.textContent = '';
    btnParse.classList.remove('active');
    btnPretty.classList.remove('active');
  });

  // ═══════════════════════════════════════════════════════════════════
  // Mode switching
  // ═══════════════════════════════════════════════════════════════════

  var currentMode = 'editor';

  window.switchMode = function(mode) {
    currentMode = mode;
    document.body.className = 'mode-' + mode;
    document.getElementById('tab-editor').className = 'mode-tab' + (mode === 'editor' ? ' active' : '');
    document.getElementById('tab-repl').className = 'mode-tab' + (mode === 'repl' ? ' active' : '');
    if (mode === 'editor') {
      document.querySelector('.panels').style.display = '';
      document.querySelector('.repl-container').style.display = 'none';
      cm.refresh();
    } else {
      document.querySelector('.panels').style.display = 'none';
      document.querySelector('.repl-container').style.display = '';
      document.getElementById('repl-input').focus();
    }
  };

  // ═══════════════════════════════════════════════════════════════════
  // REPL
  // ═══════════════════════════════════════════════════════════════════

  var replCtx = null;
  var replHistory = [];
  var replHistoryIdx = -1;
  var replInputBuf = '';
  var replLineNum = 1;

  var replOutput = document.getElementById('repl-output');
  var replInput = document.getElementById('repl-input');
  var replPromptLabel = document.getElementById('repl-prompt-label');

  function getParenDepth(s) {
    var depth = 0, inStr = false, inComment = false;
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (c === '\n') { inComment = false; continue; }
      if (inComment) continue;
      if (c === '"' && (i === 0 || s[i-1] !== '\\')) { inStr = !inStr; continue; }
      if (inStr) continue;
      if (c === ';') { inComment = true; continue; }
      if (c === '(') depth++;
      else if (c === ')') depth--;
    }
    return depth;
  }

  function replAppend(html) {
    var div = document.createElement('div');
    div.innerHTML = html;
    replOutput.appendChild(div);
    replOutput.scrollTop = replOutput.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function replEval(source) {
    if (!replCtx) return;
    var ptr = mod.ccall('eshkol_wasm_eval', 'number', ['number', 'string'], [replCtx, source]);
    var raw = mod.UTF8ToString(ptr);
    mod.ccall('eshkol_wasm_free', null, ['number'], [ptr]);
    try { return JSON.parse(raw); } catch(e) { return { error: 'parse error: ' + raw }; }
  }

  function replHandleCommand(cmd) {
    var parts = cmd.trim().split(/\s+/);
    var name = parts[0].toLowerCase();
    var arg = cmd.trim().substring(parts[0].length).trim();

    if (name === ':help' || name === ':h') {
      replAppend('<div class="repl-result cmd">' +
        ':help      Show this help\n' +
        ':clear     Clear output\n' +
        ':reset     Reset interpreter state\n' +
        ':examples  Show example expressions\n' +
        ':editor    Switch to editor mode\n' +
        ':ast expr  Show JSON AST for expression\n' +
        '</div>');
    } else if (name === ':clear') {
      replOutput.innerHTML = '';
    } else if (name === ':reset') {
      if (replCtx) mod.ccall('eshkol_wasm_interp_reset', null, ['number'], [replCtx]);
      replAppend('<div class="repl-result cmd">Environment reset.</div>');
    } else if (name === ':editor') {
      switchMode('editor');
    } else if (name === ':examples') {
      replAppend('<div class="repl-result cmd">' +
        '<b>Arithmetic:</b>\n  (+ 1 2)              ;; => 3\n  (* 2 (+ 3 4))        ;; => 14\n\n' +
        '<b>Variables & Functions:</b>\n  (define x 42)\n  (define (square n) (* n n))\n  (square 5)            ;; => 25\n\n' +
        '<b>Lambda & Closures:</b>\n  ((lambda (x) (+ x 5)) 10)  ;; => 15\n\n' +
        '<b>Lists:</b>\n  (list 1 2 3)          ;; => (1 2 3)\n  (map square (list 1 2 3))   ;; => (1 4 9)\n\n' +
        '<b>Recursion:</b>\n  (define (fact n) (if (<= n 1) 1 (* n (fact (- n 1)))))\n  (fact 10)             ;; => 3628800\n\n' +
        '<b>Let Bindings:</b>\n  (let ((a 3) (b 4)) (sqrt (+ (* a a) (* b b))))  ;; => 5.0\n' +
        '</div>');
    } else if (name === ':ast' && arg) {
      var json = callWasm('eshkol_wasm_parse', arg);
      try {
        var ast = JSON.parse(json);
        replAppend('<div class="repl-result">' + escapeHtml(JSON.stringify(ast, null, 2)) + '</div>');
      } catch(e) {
        replAppend('<div class="repl-result error">' + escapeHtml(json) + '</div>');
      }
    } else {
      replAppend('<div class="repl-result error">Unknown command: ' + escapeHtml(name) + ' (try :help)</div>');
    }
  }

  function replSubmitLine(line) {
    if (!line.trim()) return;

    // Show echo
    var promptText = replInputBuf ? '...&gt; ' : 'eshkol&gt; ';
    replAppend('<div class="repl-entry"><div class="repl-echo"><span class="repl-prompt-text">' +
               promptText + '</span>' + escapeHtml(line) + '</div></div>');

    // Accumulate
    replInputBuf += (replInputBuf ? '\n' : '') + line;
    var depth = getParenDepth(replInputBuf);

    if (depth > 0) {
      // Multi-line: waiting for more
      replPromptLabel.textContent = '...> ';
      return;
    }

    // Complete expression
    var source = replInputBuf;
    replInputBuf = '';
    replPromptLabel.textContent = 'eshkol> ';

    // Save to history
    replHistory.push(source);
    replHistoryIdx = replHistory.length;

    if (depth < 0) {
      replAppend('<div class="repl-result error">Unmatched closing parenthesis</div>');
      return;
    }

    // Check for command
    if (source.trim().charAt(0) === ':') {
      replHandleCommand(source.trim());
      return;
    }

    // Evaluate
    var t0 = performance.now();
    var result = replEval(source);
    var elapsed = (performance.now() - t0).toFixed(1);

    if (!result) return;

    var html = '';

    // Show captured output
    if (result.output) {
      html += '<div class="repl-result output">' + escapeHtml(result.output) + '</div>';
    }

    // Show result or error
    if (result.error) {
      html += '<div class="repl-result error">' + escapeHtml(result.error) + '</div>';
    } else if (result.value && result.type !== 'void') {
      html += '<div class="repl-result">' + escapeHtml(result.value) + '</div>';
    }

    if (html) replAppend(html);
    timing.textContent = 'Evaluated in ' + elapsed + 'ms';
  }

  replInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var line = replInput.value;
      replInput.value = '';
      replSubmitLine(line);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (replHistoryIdx > 0) {
        replHistoryIdx--;
        replInput.value = replHistory[replHistoryIdx];
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (replHistoryIdx < replHistory.length - 1) {
        replHistoryIdx++;
        replInput.value = replHistory[replHistoryIdx];
      } else {
        replHistoryIdx = replHistory.length;
        replInput.value = '';
      }
    } else if (e.key === 'Escape') {
      if (replInputBuf) {
        replInputBuf = '';
        replPromptLabel.textContent = 'eshkol> ';
        replAppend('<div class="repl-result cmd">Input cancelled.</div>');
      }
    }
  });

  // ═══════════════════════════════════════════════════════════════════
  // Init
  // ═══════════════════════════════════════════════════════════════════

  var t0 = performance.now();
  EshkolCompiler().then(function(instance) {
    mod = instance;
    var elapsed = (performance.now() - t0).toFixed(0);
    status.textContent = 'Ready (loaded in ' + elapsed + 'ms)';
    statusDot.className = 'ready';
    btnRun.disabled = false;
    btnParse.disabled = false;
    btnPretty.disabled = false;
    btnClear.disabled = false;

    // Create interpreter context for REPL
    replCtx = mod.ccall('eshkol_wasm_interp_create', 'number', [], []);
    document.getElementById('repl-input').disabled = false;
  }).catch(function(e) {
    status.textContent = 'Failed to load: ' + e.message;
    statusDot.className = 'error';
    console.error('Eshkol init failed:', e);
  });
</script>

</body>
</html>
